<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ethio Time – Ethiopian clock and calendar converter</title>
<meta name="description" content="A live Ethiopian clock (hour 12 at dawn), a Gregorian ⇄ Ethiopian date converter, and a browsable Ethiopian month. proudly made by Nere">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#10242c">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕰️</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600&family=Noto+Serif+Ethiopic:wght@600;800&display=swap">
<style>
:root{
  --bg:#e8f0f2; --surface:#f7fafb; --ink:#10242c; --muted:#53707a; --line:#c4d4d9;
  --accent:#b8780f; --accent-ink:#fff; --day:#f2b84b; --night:#1d3b47;
  --serif:"Noto Serif Ethiopic",Georgia,serif; --sans:"Noto Sans Ethiopic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0c1a20;--surface:#13272f;--ink:#e6eff2;--muted:#8fabb4;--line:#27434d;--accent:#f2b84b;--accent-ink:#10242c;--night:#8fb7c6}
}
:root[data-theme="dark"]{--bg:#0c1a20;--surface:#13272f;--ink:#e6eff2;--muted:#8fabb4;--line:#27434d;--accent:#f2b84b;--accent-ink:#10242c;--night:#8fb7c6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--sans);min-height:100vh}
main{max-width:980px;margin:0 auto;padding:clamp(16px,4vw,40px)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font:800 clamp(1.5rem,4vw,2.2rem)/1.2 var(--serif);margin:0}
h2{font:600 1.15rem/1.3 var(--serif);margin:0 0 12px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hero{display:grid;grid-template-columns:minmax(240px,340px) 1fr;gap:clamp(20px,5vw,56px);align-items:center;margin:32px 0}
@media(max-width:700px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}
svg.dial{width:100%;max-width:340px;height:auto}
.dial .face{fill:var(--surface);stroke:var(--line);stroke-width:2}
.dial .tick{stroke:var(--muted);stroke-width:2}
.dial text{fill:var(--ink);font:600 15px var(--sans);text-anchor:middle;dominant-baseline:central}
.dial .h{stroke:var(--ink);stroke-width:6;stroke-linecap:round}
.dial .m{stroke:var(--ink);stroke-width:3.5;stroke-linecap:round}
.dial .s{stroke:var(--accent);stroke-width:2;stroke-linecap:round}
.dial .dawn{fill:var(--accent)}
.big{font:800 clamp(2.4rem,8vw,4.2rem)/1 var(--serif);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.period{font:600 1.1rem var(--serif);color:var(--accent)}
.sub{color:var(--muted);margin:6px 0}
.date-line{font:600 1.35rem/1.3 var(--serif);margin-top:18px}
.note{max-width:46ch;color:var(--muted);font-size:.95rem;margin-top:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:4px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.row{display:grid;grid-template-columns:1.2fr 1.6fr 1fr;gap:8px}
.out{margin-top:14px;font:600 1.1rem/1.4 var(--serif);min-height:1.6em}
.err{color:#b3261e;font:400 .95rem var(--sans)}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dow{color:var(--muted);font-size:.85rem;padding:4px 0}
.cal button{padding:8px 0;border-radius:8px;border-color:transparent;background:transparent;font-variant-numeric:tabular-nums}
.cal button:hover{background:var(--bg)}
.cal button.today{background:var(--accent);color:var(--accent-ink);font-weight:600}
.cal button.sel{border-color:var(--ink)}
.cal span.pad{display:block}
footer{margin:32px 0 8px;color:var(--muted);font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<header>
  <h1>Ethio Time</h1>
  <button id="theme" type="button" aria-label="Toggle light and dark theme">Theme</button>
</header>

<section class="hero" aria-label="Current Ethiopian time">
  <svg class="dial" viewBox="0 0 200 200" role="img" aria-label="Ethiopian clock face with 12 at the top, which is 6 o'clock western time">
    <circle class="face" cx="100" cy="100" r="96"/>
    <g id="ticks"></g>
    <circle class="dawn" cx="100" cy="14" r="4"/>
    <line id="hh" class="h" x1="100" y1="100" x2="100" y2="58"/>
    <line id="mh" class="m" x1="100" y1="100" x2="100" y2="34"/>
    <line id="sh" class="s" x1="100" y1="112" x2="100" y2="26"/>
    <circle cx="100" cy="100" r="5" fill="var(--ink)"/>
  </svg>
  <div>
    <div class="period" id="period"></div>
    <div class="big" id="time">--:--:--</div>
    <p class="sub" id="western"></p>
    <div class="date-line" id="today"></div>
    <p class="note">Ethiopians count hours from sunrise, so 12 o'clock is dawn. The dot at the top of the dial marks that moment, 6:00 on a western clock.</p>
  </div>
</section>

<section class="grid2">
  <div class="card">
    <h2>Convert a date</h2>
    <label for="g">Gregorian date</label>
    <input id="g" type="date">
    <div class="out" id="g2e"></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
    <label>Ethiopian date</label>
    <div class="row">
      <input id="ey" type="number" aria-label="Ethiopian year" min="1" max="9999">
      <select id="em" aria-label="Ethiopian month"></select>
      <input id="ed" type="number" aria-label="Ethiopian day" min="1" max="30">
    </div>
    <div class="out" id="e2g"></div>
  </div>

  <div class="card">
    <div class="cal-head">
      <button id="prev" type="button" aria-label="Previous month">‹</button>
      <h2 id="calTitle" style="margin:0"></h2>
      <button id="next" type="button" aria-label="Next month">›</button>
    </div>
    <div class="cal" id="cal"></div>
  </div>
</section>

<footer>Made by Nere. no dependencies, no paywall, no tracking.</footer>
</main>

<script>
"use strict";
const MONTHS=[["መስከረም","Meskerem"],["ጥቅምት","Tikimt"],["ኅዳር","Hidar"],["ታኅሣሥ","Tahsas"],["ጥር","Tir"],["የካቲት","Yekatit"],["መጋቢት","Megabit"],["ሚያዝያ","Miyazia"],["ግንቦት","Ginbot"],["ሰኔ","Sene"],["ሐምሌ","Hamle"],["ነሐሴ","Nehase"],["ጳጉሜን","Pagume"]];
const DAYS=["እሑድ","ሰኞ","ማክሰኞ","ረቡዕ","ሐሙስ","ዓርብ","ቅዳሜ"];
const DOW_SHORT=["እሑ","ሰኞ","ማክ","ረቡ","ሐሙ","ዓር","ቅዳ"];
const EN_DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const EN_MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const EPOCH=1723856, fl=Math.floor;

/* Julian Day Number conversions */
const gToJdn=(y,m,d)=>{const a=fl((14-m)/12),y2=y+4800-a,m2=m+12*a-3;
  return d+fl((153*m2+2)/5)+365*y2+fl(y2/4)-fl(y2/100)+fl(y2/400)-32045};
const jdnToG=j=>{const a=j+32044,b=fl((4*a+3)/146097),c=a-fl(146097*b/4),d=fl((4*c+3)/1461),
  e=c-fl(1461*d/4),m=fl((5*e+2)/153);
  return{y:100*b+d-4800+fl(m/10),m:m+3-12*fl(m/10),d:e-fl((153*m+2)/5)+1}};
const eToJdn=(y,m,d)=>EPOCH+365+365*(y-1)+fl(y/4)+30*m+d-31;
const jdnToE=j=>{const r=(j-EPOCH)%1461,n=(r%365)+365*fl(r/1460);
  return{y:4*fl((j-EPOCH)/1461)+fl(r/365)-fl(r/1460),m:fl(n/30)+1,d:(n%30)+1}};
const eMonthLen=(y,m)=>m<13?30:(y%4===3?6:5);
const weekday=j=>(j+1)%7;

const $=id=>document.getElementById(id);
const fmtE=(e,j)=>`${DAYS[weekday(j)]}፣ ${MONTHS[e.m-1][0]} ${e.d} ${e.y}<br><span class="sub">${EN_DAYS[weekday(j)]}, ${MONTHS[e.m-1][1]} ${e.d}, ${e.y}</span>`;
const fmtG=g=>`${EN_MONTHS[g.m-1]} ${g.d}, ${g.y}`;
const nowJdn=()=>{const n=new Date();return gToJdn(n.getFullYear(),n.getMonth()+1,n.getDate())};

/* Clock */
const ticks=$("ticks");
for(let i=1;i<=12;i++){
  const a=i*30*Math.PI/180,x=100+Math.sin(a)*78,y=100-Math.cos(a)*78;
  const t=document.createElementNS("http://www.w3.org/2000/svg","text");
  t.setAttribute("x",x.toFixed(1));t.setAttribute("y",y.toFixed(1));t.textContent=i;ticks.appendChild(t);
}
for(let i=0;i<60;i++){
  const a=i*6*Math.PI/180,long=i%5===0,r1=long?88:91,r2=95;
  const l=document.createElementNS("http://www.w3.org/2000/svg","line");
  l.setAttribute("class","tick");l.setAttribute("x1",100+Math.sin(a)*r1);l.setAttribute("y1",100-Math.cos(a)*r1);
  l.setAttribute("x2",100+Math.sin(a)*r2);l.setAttribute("y2",100-Math.cos(a)*r2);
  if(!long)l.setAttribute("stroke-width","1");ticks.appendChild(l);
}
const pad=n=>String(n).padStart(2,"0");
function tick(){
  const n=new Date(),h=n.getHours(),m=n.getMinutes(),s=n.getSeconds();
  let eh=(h-6+24)%12; if(eh===0)eh=12;
  const isDay=h>=6&&h<18;
  $("time").textContent=`${eh}:${pad(m)}:${pad(s)}`;
  $("period").textContent=isDay?"ቀን · day":"ሌሊት · night";
  $("western").textContent=`Western clock: ${pad(h)}:${pad(m)}:${pad(s)}`;
  const ha=((eh%12)+m/60)*30, ma=(m+s/60)*6, sa=s*6;
  $("hh").setAttribute("transform",`rotate(${ha} 100 100)`);
  $("mh").setAttribute("transform",`rotate(${ma} 100 100)`);
  $("sh").setAttribute("transform",`rotate(${sa} 100 100)`);
  const j=nowJdn(); $("today").innerHTML=fmtE(jdnToE(j),j);
}
tick(); setInterval(tick,1000);

/* Converter */
MONTHS.forEach((mn,i)=>{const o=document.createElement("option");o.value=i+1;o.textContent=`${i+1}. ${mn[0]} (${mn[1]})`;$("em").appendChild(o)});
function gToE(){
  const v=$("g").value; if(!v){$("g2e").textContent="";return}
  const [y,m,d]=v.split("-").map(Number), j=gToJdn(y,m,d);
  $("g2e").innerHTML=fmtE(jdnToE(j),j);
}
function eToG(){
  const y=+$("ey").value,m=+$("em").value,d=+$("ed").value,out=$("e2g");
  if(!y||!d){out.textContent="";return}
  if(d<1||d>eMonthLen(y,m)){out.innerHTML=`<span class="err">${MONTHS[m-1][1]} ${y} has ${eMonthLen(y,m)} days.</span>`;return}
  const j=eToJdn(y,m,d),g=jdnToG(j);
  out.innerHTML=`${EN_DAYS[weekday(j)]}, ${fmtG(g)}`;
  view={y,m}; sel={y,m,d}; drawCal();
}
$("g").addEventListener("input",gToE);
["ey","em","ed"].forEach(id=>$(id).addEventListener("input",eToG));

/* Month grid */
let td=jdnToE(nowJdn()), view={y:td.y,m:td.m}, sel=null;
function drawCal(){
  const {y,m}=view; $("calTitle").textContent=`${MONTHS[m-1][0]} ${y}`;
  const el=$("cal"); el.innerHTML="";
  DOW_SHORT.forEach(d=>{const c=document.createElement("div");c.className="dow";c.textContent=d;el.appendChild(c)});
  const first=weekday(eToJdn(y,m,1));
  for(let i=0;i<first;i++){const s=document.createElement("span");s.className="pad";el.appendChild(s)}
  for(let d=1;d<=eMonthLen(y,m);d++){
    const b=document.createElement("button");b.type="button";b.textContent=d;
    if(y===td.y&&m===td.m&&d===td.d)b.classList.add("today");
    if(sel&&sel.y===y&&sel.m===m&&sel.d===d)b.classList.add("sel");
    b.addEventListener("click",()=>{
      $("ey").value=y;$("em").value=m;$("ed").value=d;sel={y,m,d};eToG();
      const g=jdnToG(eToJdn(y,m,d));
      $("g").value=`${g.y}-${pad(g.m)}-${pad(g.d)}`;gToE();
    });
    el.appendChild(b);
  }
}
function step(n){
  let {y,m}=view; m+=n; if(m>13){m=1;y++} if(m<1){m=13;y--} view={y,m}; drawCal();
}
$("prev").onclick=()=>step(-1); $("next").onclick=()=>step(1);

/* Init */
(function(){
  const n=new Date(); $("g").value=`${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`; gToE();
  $("ey").value=td.y;$("em").value=td.m;$("ed").value=td.d;
  $("e2g").textContent=""; drawCal();
})();

/* Offline + install support */
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}

/* Theme */
$("theme").onclick=()=>{
  const root=document.documentElement;
  const dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  root.dataset.theme=dark?"light":"dark";
};
</script>
</body>
</html>
